spring.application.name=atividade_produtos

# Idioma
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# Banco H2 em arquivo (os dados persistem entre execucoes, em ./data/)
spring.datasource.url=jdbc:h2:file:./data/estoque
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Console do H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false

# Cadastra categorias e produtos de exemplo quando o banco esta vazio
estoque.dados-demo=true
